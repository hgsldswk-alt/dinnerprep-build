name: DinnerPrep
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.dinnerprep
    APP_STORE_ID: "6838245716"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  DinnerPrep:
    type: application
    platform: iOS
    sources: [DinnerPrep, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: DinnerPrep AppStore
    info:
      path: DinnerPrep/Info.plist
      properties:
        CFBundleDisplayName: Dinner Prep
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        DinnerProProductID: $(APP_ID).pro
        DinnerTrialProductID: $(APP_ID).trial
  DinnerPrepTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DinnerPrepTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  DinnerPrepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DinnerPrepUITests]
    dependencies:
      - target: DinnerPrep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DinnerPrep
schemes:
  DinnerPrep:
    build:
      targets:
        DinnerPrep: all
        DinnerPrepTests: [test]
    test:
      config: Debug
      targets: [DinnerPrepTests]
  DinnerPrepUI:
    build:
      targets:
        DinnerPrep: all
        DinnerPrepUITests: [test]
    test:
      config: Debug
      targets: [DinnerPrepUITests]
